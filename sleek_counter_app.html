<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Modern Counter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pop-up': 'popUp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'pop-down': 'popDown 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        popUp: {
                            '0%': { transform: 'scale(0.8) translateY(10px)', opacity: '0.5' },
                            '100%': { transform: 'scale(1) translateY(0)', opacity: '1' }
                        },
                        popDown: {
                            '0%': { transform: 'scale(0.8) translateY(-10px)', opacity: '0.5' },
                            '100%': { transform: 'scale(1) translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .glass-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .action-btn {
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- Top Bar / Navigation -->
    <header class="w-full max-w-md pt-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                #
            </div>
            <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Counter</span>
        </div>

        <div class="flex items-center gap-2">
            <!-- Sound Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700/50 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500/50" title="Toggle Sound Feedback">
                <!-- Sound On Icon -->
                <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <!-- Sound Off Icon -->
                <svg id="soundOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
            </button>

            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700/50 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500/50" title="Toggle Light/Dark Theme">
                <!-- Moon Icon -->
                <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <!-- Sun Icon -->
                <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-md my-auto py-6">
        <div class="glass-panel bg-slate-900/60 dark:bg-slate-900/40 border border-slate-800 dark:border-slate-800/80 rounded-3xl p-8 shadow-2xl relative overflow-hidden flex flex-col items-center">
            
            <!-- Step Customizer -->
            <div class="w-full flex justify-between items-center mb-8">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Step Value</span>
                <div class="flex bg-slate-800/90 p-1 rounded-xl border border-slate-700/60">
                    <button onclick="setStep(1)" id="step-1" class="step-btn px-3 py-1 rounded-lg text-xs font-mono font-bold transition-all bg-indigo-600 text-white shadow-sm">1</button>
                    <button onclick="setStep(5)" id="step-5" class="step-btn px-3 py-1 rounded-lg text-xs font-mono font-bold transition-all text-slate-400 hover:text-slate-200">5</button>
                    <button onclick="setStep(10)" id="step-10" class="step-btn px-3 py-1 rounded-lg text-xs font-mono font-bold transition-all text-slate-400 hover:text-slate-200">10</button>
                    <button onclick="setStep(100)" id="step-100" class="step-btn px-3 py-1 rounded-lg text-xs font-mono font-bold transition-all text-slate-400 hover:text-slate-200">100</button>
                </div>
            </div>

            <!-- Number Counter Display -->
            <div class="my-6 relative min-h-[120px] flex items-center justify-center w-full">
                <div id="counterContainer" class="transition-transform duration-150">
                    <span id="counterValue" class="text-7xl sm:text-8xl font-black font-mono tracking-tight text-slate-100 dark:text-white drop-shadow-xl inline-block select-none">
                        0
                    </span>
                </div>
            </div>

            <!-- Main Action Buttons -->
            <div class="grid grid-cols-2 gap-4 w-full my-4">
                <!-- Decrement Button -->
                <button id="btnDecrement" onclick="decrement()" class="action-btn py-5 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 active:bg-rose-500/30 text-rose-400 border border-rose-500/20 flex flex-col items-center justify-center gap-1 shadow-lg group focus:outline-none focus:ring-2 focus:ring-rose-500/40">
                    <svg class="w-8 h-8 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path>
                    </svg>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400/80">Subtract</span>
                </button>

                <!-- Increment Button -->
                <button id="btnIncrement" onclick="increment()" class="action-btn py-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white border border-indigo-500/30 flex flex-col items-center justify-center gap-1 shadow-xl shadow-indigo-600/20 group focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
                    <svg class="w-8 h-8 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-100/90">Add</span>
                </button>
            </div>

            <!-- Reset Button -->
            <button id="btnReset" onclick="reset()" class="action-btn w-full mt-2 py-3 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 text-slate-400 hover:text-slate-200 border border-slate-700/50 flex items-center justify-center gap-2 text-xs font-semibold tracking-wider uppercase focus:outline-none focus:ring-2 focus:ring-slate-600/40">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Reset Count
            </button>

        </div>
    </main>

    <!-- Keyboard Shortcuts Banner -->
    <footer class="w-full max-w-md pb-4">
        <div class="glass-panel bg-slate-900/40 border border-slate-800/60 rounded-2xl p-4 text-xs text-slate-400 flex justify-around items-center">
            <div class="flex items-center gap-1.5">
                <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-[11px] font-mono text-slate-300 font-semibold shadow-sm">↑</kbd>
                <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-[11px] font-mono text-slate-300 font-semibold shadow-sm">+</kbd>
                <span>Add</span>
            </div>
            <div class="w-px h-4 bg-slate-800"></div>
            <div class="flex items-center gap-1.5">
                <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-[11px] font-mono text-slate-300 font-semibold shadow-sm">↓</kbd>
                <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-[11px] font-mono text-slate-300 font-semibold shadow-sm">-</kbd>
                <span>Sub</span>
            </div>
            <div class="w-px h-4 bg-slate-800"></div>
            <div class="flex items-center gap-1.5">
                <kbd class="px-2 py-1 bg-slate-800 border border-slate-700 rounded text-[11px] font-mono text-slate-300 font-semibold shadow-sm">R</kbd>
                <span>Reset</span>
            </div>
        </div>
    </footer>

    <script>
        // State variables
        let count = 0;
        let step = 1;
        let soundEnabled = true;
        let isDarkMode = true;

        // DOM elements
        const counterValueEl = document.getElementById('counterValue');
        const counterContainerEl = document.getElementById('counterContainer');

        // Web Audio API Synthesizer for UI feedback
        let audioCtx = null;

        function playClickSound(frequency = 440, type = 'sine') {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                // Exponential decay envelope
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.warn('Web Audio not supported or allowed yet', e);
            }
        }

        // Trigger trigger vibration haptics if available on device
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        // Update UI Display with animation
        function updateDisplay(direction = 'up') {
            counterValueEl.textContent = count;

            // Re-trigger animation
            counterContainerEl.classList.remove('animate-pop-up', 'animate-pop-down');
            void counterContainerEl.offsetWidth; // Force reflow

            if (direction === 'up') {
                counterContainerEl.classList.add('animate-pop-up');
            } else if (direction === 'down') {
                counterContainerEl.classList.add('animate-pop-down');
            } else {
                counterContainerEl.classList.add('animate-pop-up');
            }
        }

        // Counter actions
        function increment() {
            count += step;
            playClickSound(520 + Math.min(count * 2, 400), 'sine');
            triggerHaptic();
            updateDisplay('up');
        }

        function decrement() {
            count -= step;
            playClickSound(340, 'triangle');
            triggerHaptic();
            updateDisplay('down');
        }

        function reset() {
            if (count === 0) return;
            count = 0;
            playClickSound(220, 'sawtooth');
            triggerHaptic();
            updateDisplay('none');
        }

        function setStep(newStep) {
            step = newStep;
            playClickSound(600, 'sine');
            
            // Update active state on step buttons
            document.querySelectorAll('.step-btn').forEach(btn => {
                btn.className = 'step-btn px-3 py-1 rounded-lg text-xs font-mono font-bold transition-all text-slate-400 hover:text-slate-200';
            });
            const activeBtn = document.getElementById(`step-${newStep}`);
            if (activeBtn) {
                activeBtn.className = 'step-btn px-3 py-1 rounded-lg text-xs font-mono font-bold transition-all bg-indigo-600 text-white shadow-sm';
            }
        }

        // Toggle Sound Settings
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
            document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);
            if (soundEnabled) playClickSound(800, 'sine');
        }

        // Toggle Dark / Light theme
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.classList.toggle('dark', isDarkMode);
            document.getElementById('moonIcon').classList.toggle('hidden', !isDarkMode);
            document.getElementById('sunIcon').classList.toggle('hidden', isDarkMode);

            if (!isDarkMode) {
                document.body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-indigo-500 selection:text-white";
            } else {
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-indigo-500 selection:text-white";
            }
        }

        // Keyboard navigation listener
        window.addEventListener('keydown', (e) => {
            // Avoid triggering during input editing
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') {
                e.preventDefault();
                increment();
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                decrement();
            } else if (e.key.toLowerCase() === 'r') {
                e.preventDefault();
                reset();
            }
        });
    </script>
</body>
</html>
